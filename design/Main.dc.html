  <p style="margin: 12px 0 0; font-size: 15px; line-height: 1.6; color: #ABA5BF">친구들이 나에게 어울리는 상을 골라 트로피를 보내줘요. 12월 31일, 한꺼번에 공개돼요.</p>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px; border-radius: 14px; background: #1D1A2B">
      <span style="width: 24px; height: 24px; border-radius: 50%; background: #E8B84A; color: #1A1526; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px; border-radius: 14px; background: #1D1A2B">

      <span style="font-size: 13px; font-weight: 500">12.31 공개</span>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <label for="owner-name" style="font-size: 13px; font-weight: 500; color: #ABA5BF">시상식 주인공 이름</label>
  <input id="owner-name" type="text" placeholder="닉네임 (최대 8자)" style="margin-top: 8px; height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1px solid #3A3452; background: #221D33; color: #F6F1E7; font-size: 16px; font-family: inherit; outline: none">
  <a href="Owner.dc.html" style="margin-top: 12px; height: 56px; border-radius: 16px; background: #E8B84A; color: #1A1526; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">내 시상식 열기</a>
