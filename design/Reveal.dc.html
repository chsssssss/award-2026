<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>12월 31일 결과 공개</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E8B84A}a:hover{color:#F3CD72}
</style>
</helmet>
<div style="width: 390px; height: 1240px; box-sizing: border-box; padding: 24px 24px 32px; background: #15131F; color: #F6F1E7; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 12px; font-weight: 700; color: #E8B84A; border: 1px solid #E8B84A; border-radius: 999px; padding: 4px 10px">12월 31일 공개</span>
    <span style="font-size: 13px; color: #ABA5BF">트로피 14개</span>
  </div>
  <h1 style="margin: 16px 0 0; font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 28px; letter-spacing: -0.4px">지민의 2026 시상식</h1>
  <p style="margin: 6px 0 0; font-size: 14px; color: #ABA5BF">친구 14명이 트로피를 보냈어요</p>

  <div style="margin-top: 20px; padding: 24px; border-radius: 24px; background: #221D33; display: flex; flex-direction: column; align-items: center; text-align: center">
    <span style="font-size: 13px; font-weight: 700; color: #1A1526; background: #E8B84A; border-radius: 999px; padding: 5px 14px">대상</span>
    <div style="position: relative; width: 100%; height: 140px; display: flex; align-items: center; justify-content: center">
      <svg width="120" height="120" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M20 14 H13 V18 C13 23 16 26 20.5 26" fill="none" stroke="#E8B84A" stroke-width="2.5" stroke-linecap="round"></path>
        <path d="M44 14 H51 V18 C51 23 48 26 43.5 26" fill="none" stroke="#E8B84A" stroke-width="2.5" stroke-linecap="round"></path>
        <path d="M20 10 H44 V24 C44 31.7 38.6 38 32 38 C25.4 38 20 31.7 20 24 Z" fill="#E8B84A"></path>
        <path d="M25.5 14 V23" stroke="#F7DE9C" stroke-width="2.5" stroke-linecap="round"></path>
        <rect x="29.5" y="37.5" width="5" height="8.5" fill="#C9962E"></rect>
        <rect x="23" y="46" width="18" height="5" rx="1.5" fill="#C9962E"></rect>
        <rect x="19" y="51" width="26" height="5" rx="1.5" fill="#E8B84A"></rect>
      </svg>
      <svg style="position: absolute; left: 70px; top: 18px" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L13.8 10.2 L22 12 L13.8 13.8 L12 22 L10.2 13.8 L2 12 L10.2 10.2 Z" fill="#E8B84A"></path></svg>
      <svg style="position: absolute; right: 72px; top: 40px" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L13.8 10.2 L22 12 L13.8 13.8 L12 22 L10.2 13.8 L2 12 L10.2 10.2 Z" fill="#F7DE9C"></path></svg>
      <svg style="position: absolute; right: 82px; bottom: 16px" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L13.8 10.2 L22 12 L13.8 13.8 L12 22 L10.2 13.8 L2 12 L10.2 10.2 Z" fill="#E8B84A"></path></svg>
    </div>
    <div style="font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 26px; letter-spacing: -0.4px">웃음 지분 1위상</div>
    <div style="margin-top: 6px; font-size: 14px; color: #ABA5BF">친구 5명이 이 상을 줬어요</div>
  </div>

  <div style="margin-top: 28px; display: flex; align-items: baseline; justify-content: space-between">
    <h2 style="margin: 0; font-size: 16px; font-weight: 700">트로피 진열장</h2>
    <span style="font-size: 13px; color: #ABA5BF">6종 · 14개</span>
  </div>
  <div style="margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{ items }}" as="a" hint-placeholder-count="6">
      <button type="button" onClick="{{ a.pick }}" aria-pressed="{{ a.selected }}" style="height: 116px; box-sizing: border-box; padding: 8px 6px; border-radius: 16px; border: 2px solid {{ a.border }}; background: {{ a.bg }}; color: #F6F1E7; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
        <svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M20 14 H13 V18 C13 23 16 26 20.5 26 M44 14 H51 V18 C51 23 48 26 43.5 26" fill="none" stroke="#E8B84A" stroke-width="3" stroke-linecap="round"></path>
          <path d="M20 10 H44 V24 C44 31.7 38.6 38 32 38 C25.4 38 20 31.7 20 24 Z" fill="#E8B84A"></path>
          <rect x="29.5" y="37.5" width="5" height="8.5" fill="#C9962E"></rect>
          <rect x="21" y="46" width="22" height="8" rx="2" fill="#C9962E"></rect>
        </svg>
        <span style="font-size: 12px; font-weight: 500; line-height: 1.3; text-align: center">{{ a.name }}</span>
        <span style="font-size: 13px; font-weight: 700; color: #E8B84A">{{ a.countLabel }}</span>
      </button>
    </sc-for>
  </div>

  <h3 style="margin: 24px 0 0; font-size: 15px; font-weight: 700">{{ selTitle }}</h3>
  <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{ selComments }}" as="c" hint-placeholder-count="3">
      <div style="padding: 14px 16px; border-radius: 16px; background: #1D1A2B">
        <div style="font-size: 13px; font-weight: 700; color: #E8B84A">{{ c.from }}</div>
        <div style="margin-top: 4px; font-size: 15px; line-height: 1.5">{{ c.text }}</div>
      </div>
    </sc-for>
  </div>
  <sc-if value="{{ hasMore }}" hint-placeholder-val="{{ true }}">
    <div style="margin-top: 10px; text-align: center; font-size: 13px; color: #ABA5BF">{{ moreLabel }}</div>
  </sc-if>

  <div style="flex-grow: 1"></div>

  <a href="StoryResult.dc.html" style="height: 56px; border-radius: 16px; background: #E8B84A; color: #1A1526; font-size: 17px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">스토리로 자랑하기</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'laugh' };
  }
  renderVals() {
    const awards = [
      { id: 'laugh', name: '웃음 지분 1위상', count: 5, comments: [
        { from: '민지', text: '단톡방 지분의 절반은 너야. 덕분에 올해 버텼다' },
        { from: '도윤', text: '3월 MT 사건은 평생 우려먹을 예정' },
        { from: '익명', text: '웃다가 커피 뿜은 게 벌써 세 번째' }
      ] },
      { id: 'mood', name: '분위기 메이커상', count: 3, comments: [
        { from: '서연', text: '네가 오면 모임 텐션이 두 배' },
        { from: '익명', text: '조용하던 회식 살린 거 다 기억함' },
        { from: '준호', text: '노래방 1번 타자는 영원히 너' }
      ] },
      { id: 'counsel', name: '고민 상담소장상', count: 2, comments: [
        { from: '하은', text: '새벽 2시 전화 받아줘서 고마웠어' },
        { from: '익명', text: '말 한마디로 마음이 편해지는 사람' }
      ] },
      { id: 'food', name: '맛집 레이더상', count: 2, comments: [
        { from: '도윤', text: '너 따라간 집은 실패가 없었다' },
        { from: '민지', text: '을지로 그 국수집 또 가자' }
      ] },
      { id: 'ghost', name: '갑분잠수상', count: 1, comments: [
        { from: '준호', text: '읽씹 3일은 기본… 그래도 고맙다' }
      ] },
      { id: 'next', name: '내년 기대주상', count: 1, comments: [
        { from: '익명', text: '올해 진짜 많이 컸다. 내년엔 더 멋질 듯' }
      ] }
    ];
    const sel = this.state.sel;
    const current = awards.find((a) => a.id === sel) || awards[0];
    const more = current.count - current.comments.length;
    return {
      items: awards.map((a) => ({
        name: a.name,
        countLabel: '×' + a.count,
        selected: a.id === sel,
        border: a.id === sel ? '#E8B84A' : 'transparent',
        bg: a.id === sel ? '#2A2440' : '#1D1A2B',
        pick: () => this.setState({ sel: a.id })
      })),
      selTitle: '‘' + current.name + '’에 남긴 말',
      selComments: current.comments,
      hasMore: more > 0,
      moreLabel: '메시지 ' + more + '개 더 보기'
    };
  }
}
</script>
</body>
</html>
